<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eff9e7">
  <meta name="description" content="할인에 더 할인. 2,000개 이상 상품 비교부터 찜과 장바구니까지, PX 가이드에서 시작하세요.">
  <title>PX 가이드 시작하기</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eff9e7;font-family:system-ui,sans-serif}
    main{height:100svh;min-height:360px;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 max(14px,env(safe-area-inset-bottom))}
    picture{display:block;flex:1;min-height:0;width:100%}img{display:block;width:100%;height:100%;object-fit:contain}
    .start{flex:none;margin:8px 24px 0;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;background:#006940;color:white;border-radius:12px;text-decoration:none;font-size:18px;font-weight:800;box-shadow:0 4px 14px #00694025}
    .start:focus-visible{outline:3px solid #eaaa28;outline-offset:3px}.start:active{background:#004e30}
    @media(min-width:700px){main{padding-top:12px}}
  </style>
  <script>try{sessionStorage.setItem('px-launch-v1','1')}catch{}</script>
</head>
<body>
  <main aria-label="PX 가이드 시작 화면">
    <picture>
      <source type="image/avif" srcset="/icons/mobile-launch-2026-optimized-v1-480.avif 480w, /icons/mobile-launch-2026-optimized-v1-720.avif 720w, /icons/mobile-launch-2026-optimized-v1-941.avif 941w" sizes="(max-width:520px) 100vw, 520px">
      <img src="/icons/mobile-launch-2026-optimized-v1-720.webp" srcset="/icons/mobile-launch-2026-optimized-v1-480.webp 480w, /icons/mobile-launch-2026-optimized-v1-720.webp 720w, /icons/mobile-launch-2026-optimized-v1-941.webp 941w" sizes="(max-width:520px) 100vw, 520px" width="941" height="1672" loading="eager" fetchpriority="high" decoding="async" alt="PX 가이드 · 할인에 더 할인 · 2,000개 이상 상품 비교 · 찜, 장바구니, 가격비교">
    </picture>
    <a class="start" href="/">PX 가이드 시작하기 <span aria-hidden="true">→</span></a>
  </main>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script>
</body>
</html>
